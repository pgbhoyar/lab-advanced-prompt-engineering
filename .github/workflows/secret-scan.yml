name: Secret Scan

on:
  pull_request:
  push:
    branches: [main]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for likely secrets
        run: |
          set -e
          echo "Scanning for API-key-like patterns and committed .env files..."
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "A .env file is tracked. Remove it and rotate any exposed key."; exit 1; fi
          # Long opaque strings / bearer tokens / sk- keys in text assets
          if grep -RInE 'sk-[A-Za-z0-9]{16,}|Bearer [A-Za-z0-9._-]{16,}' \
              --include='*.md' --include='*.json' --include='*.jsonl' \
              --include='*.py' --include='*.cs' --include='*.java' \
              --include='*.yaml' --include='*.yml' . ; then
            echo "Potential secret detected"; exit 1; fi
          echo "No secrets detected."
