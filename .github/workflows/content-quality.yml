name: Content Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install tools
        run: python -m pip install --quiet jsonschema pyyaml
      - name: Validate schemas (datasets + manifests)
        run: python scripts/validate-schemas.py
      - name: Validate lab content completeness + safety rules
        run: python scripts/validate-content.py
      - name: Validate cross-track parity / divergence
        run: python scripts/validate-parity.py
      - name: Placeholder / TODO scan
        run: |
          if grep -RIn "NEEDS CLARIFICATION" --include='*.md' labs prompts docs 2>/dev/null; then
            echo "Unresolved clarification markers found"; exit 1; fi
